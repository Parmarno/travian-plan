.tgt-name { color:#ffdd88; text-decoration:none; }
.type-real { color:#ff8888; font-size:10px; }

.copy-btn { background:#0a2030; border:1px solid #1e5a7a; color:#66aacc; border-radius:3px; padding:2px 6px; cursor:pointer; font-size:10px; }
@media (max-width:700px) {

var ARRIVE_MS = 1790370000000;

function pad(n){return n<10?"0"+n:""+n;}
function fmtMs(ms){
  if(ms<0) return null;
  var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sc=s%60;
  return (h?pad(h)+"h ":"")+pad(m)+"m "+pad(sc)+"s";
}
function fmtTime(ms){
  var d=new Date(ms);
  return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
function copyText(t){
  navigator.clipboard.writeText(t).catch(function(){
    var el=document.createElement("input");el.value=t;
    document.body.appendChild(el);el.select();
    document.execCommand("copy");document.body.removeChild(el);
  });
}

function buildCards(){
  var wrap=document.getElementById("wrap");

    var hdr="<div class=\"card-hdr\">"+

      "<div class=\"card-troop\">"+atk.troop+"</div>"+

    var sortedRows=atk.rows.map(function(r,ri){return {r:r,ri:ri};}).sort(function(a,b){return a.r.sendMs-b.r.sendMs;});
    sortedRows.forEach(function(item){
      var r=item.r, ri=item.ri;
      var rc=r.isReal?"real-row":"fake-row";
      var tc=r.isReal?"type-real":"type-fake";
      var tt=r.isReal?"⚔ จริง":"👻 Fake";
      var tname=r.tgtLink
        ?"<a class=\"tgt-name\" href=\""+r.tgtLink+"\" target=\"_blank\">"+r.tgtName+"</a>"

      var sendStr=fmtTime(r.sendMs);
      tbl+="<tr class=\""+rc+"\">"+
        "<td style=\"text-align:left;padding-left:6px;\">"+tname+"</td>"+
        "<td><span class=\""+tc+"\">"+tt+"</span></td>"+
        "<td style=\"color:#88ccff;\">"+r.dist+"</td>"+

        "<td><button class=\"copy-btn\" onclick=\"copyText('"+sendStr+"')\" >📋</button></td>"+
        "</tr>";
    });
    tbl+="</tbody></table>";
    card.innerHTML=hdr+"<div class=\"tbl-wrap\">"+tbl+"</div>";
    wrap.appendChild(card);
  });
}

function tick(){
  var now=Date.now();
  document.getElementById("now-clock").textContent=fmtTime(now);
  document.getElementById("arrive-display").textContent=fmtTime(ARRIVE_MS)+" ("+new Date(ARRIVE_MS).toLocaleDateString("th-TH")+")";
  PLAN.forEach(function(atk,ai){
    atk.rows.forEach(function(r,ri){
      var el=document.getElementById("cd_"+ai+"_"+ri);
      if(!el) return;
      var left=r.sendMs-now;
      if(left<0){
        el.className="cd cd-late"; el.textContent="ส่งแล้ว";
      } else if(left<300000){
        el.className="cd cd-soon"; el.textContent=fmtMs(left);
      } else {
        el.className="cd cd-ok"; el.textContent=fmtMs(left);
      }
    });
  });
}
